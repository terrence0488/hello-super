<div 
    id="task-{{ task.id }}" 
    class="group bg-white/5 border border-gray-800/50 rounded-xl p-4 hover:border-gray-700/50 transition-all {% if task.is_completed %}opacity-60{% endif %}"
>
    <div class="flex items-start gap-4">
        <!-- Checkbox -->
        <button
            hx-post="/tasks/{{ task.id }}/toggle"
            hx-target="#task-{{ task.id }}"
            hx-swap="outerHTML"
            class="mt-1 w-5 h-5 rounded-md border-2 flex items-center justify-center transition-colors flex-shrink-0
                {% if task.is_completed %}
                    border-supabase-green bg-supabase-green
                {% else %}
                    border-gray-600 hover:border-supabase-green
                {% endif %}"
        >
            {% if task.is_completed %}
            <svg class="w-3 h-3 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
            </svg>
            {% endif %}
        </button>

        <!-- Task Content -->
        <div class="flex-1 min-w-0">
            <h3 class="font-medium {% if task.is_completed %}line-through text-gray-500{% else %}text-white{% endif %}">
                {{ task.title }}
            </h3>
            {% if task.description %}
            <p class="text-sm text-gray-500 mt-1 {% if task.is_completed %}line-through{% endif %}">
                {{ task.description }}
            </p>
            {% endif %}
            
            <!-- Attachment Badge -->
            {% if task.attachment_path %}
            <a 
                href="/storage/download/{{ task.attachment_path }}"
                target="_blank"
                class="inline-flex items-center gap-1.5 mt-2 px-2.5 py-1 rounded-lg bg-pink-500/10 border border-pink-500/20 text-pink-400 text-xs hover:bg-pink-500/20 transition-colors"
            >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                </svg>
                Attachment
            </a>
            {% endif %}
            
            <p class="text-xs text-gray-600 mt-2">
                Created {{ task.created_at[:10] if task.created_at else 'just now' }}
            </p>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
            <!-- Edit Button -->
            <button
                hx-get="/tasks/{{ task.id }}/edit"
                hx-target="#task-{{ task.id }}"
                hx-swap="outerHTML"
                class="p-2 rounded-lg hover:bg-white/10 text-gray-400 hover:text-white transition-colors"
                title="Edit task"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
            </button>
            
            <!-- Delete Button -->
            <button
                hx-delete="/tasks/{{ task.id }}"
                hx-target="#task-{{ task.id }}"
                hx-swap="outerHTML"
                hx-confirm="Are you sure you want to delete this task?"
                class="p-2 rounded-lg hover:bg-red-500/20 text-gray-400 hover:text-red-400 transition-colors"
                title="Delete task"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>
        </div>
    </div>
</div>
