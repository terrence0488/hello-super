<div 
    id="task-{{ task.id }}" 
    class="bg-white/5 border border-supabase-green/50 rounded-xl p-4"
>
    <form
        hx-put="/tasks/{{ task.id }}"
        hx-target="#task-{{ task.id }}"
        hx-swap="outerHTML"
        class="space-y-4"
    >
        <!-- Title Input -->
        <div>
            <input
                type="text"
                name="title"
                value="{{ task.title }}"
                required
                class="w-full px-4 py-2 rounded-lg bg-black/30 border border-gray-700 focus:border-supabase-green focus:ring-1 focus:ring-supabase-green text-white placeholder-gray-500 transition-colors"
                placeholder="Task title"
            >
        </div>
        
        <!-- Description Input -->
        <div>
            <input
                type="text"
                name="description"
                value="{{ task.description or '' }}"
                class="w-full px-4 py-2 rounded-lg bg-black/30 border border-gray-700 focus:border-supabase-green focus:ring-1 focus:ring-supabase-green text-white placeholder-gray-500 transition-colors"
                placeholder="Description (optional)"
            >
        </div>
        
        <!-- Action Buttons -->
        <div class="flex items-center gap-3">
            <button
                type="submit"
                class="px-4 py-2 bg-supabase-green hover:bg-emerald-500 text-black font-medium rounded-lg transition-colors text-sm"
            >
                Save Changes
            </button>
            <button
                type="button"
                hx-get="/tasks/{{ task.id }}/edit"
                hx-target="#task-{{ task.id }}"
                hx-swap="outerHTML"
                hx-vals='{"cancel": "true"}'
                onclick="location.reload()"
                class="px-4 py-2 border border-gray-700 hover:border-gray-500 text-gray-300 hover:text-white font-medium rounded-lg transition-colors text-sm"
            >
                Cancel
            </button>
        </div>
    </form>
</div>
